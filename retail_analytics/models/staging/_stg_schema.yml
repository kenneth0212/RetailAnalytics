version: 2

models:
  - name: stg_customers
    description: "Cleaned customer data from TPCH"
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: market_segment
        tests:
          - accepted_values:
              values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']

  - name: stg_orders
    description: "Cleaned order headers from TPCH"
    columns:
      - name: order_key
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_key
      - name: order_status
        tests:
          - accepted_values:
              values: ['O', 'F', 'P']

  - name: stg_lineitem
    description: "Cleaned line item details from TPCH"
    columns:
      - name: order_key
        tests:
          - not_null
      - name: line_number
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: extended_price
        tests:
          - not_null

  - name: stg_parts
    description: "Cleaned part/product data from TPCH"
    columns:
      - name: part_key
        tests:
          - unique
          - not_null

  - name: stg_suppliers
    description: "Cleaned supplier data from TPCH"
    columns:
      - name: supplier_key
        tests:
          - unique
          - not_null

  - name: stg_nations
    description: "Nation reference data from TPCH"
    columns:
      - name: nation_key
        tests:
          - unique
          - not_null

  - name: stg_regions
    description: "Region reference data from TPCH"
    columns:
      - name: region_key
        tests:
          - unique
          - not_null
